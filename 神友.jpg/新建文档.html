<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>思绪与雪散 又写几轮冬</title>

    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif; 
            color: #fff; background-color: #000; 
        }

        /* ================= 黑色快速开场渐显 ================= */
        .intro-black-screen {
            position: fixed; inset: 0; background: #000; z-index: 999999;
            pointer-events: none; animation: introFadeOut 0.8s ease forwards;
        }
        @keyframes introFadeOut { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* ================= 全局跳转模糊遮罩 ================= */
        .page-transition-overlay {
            position: fixed; inset: 0; background: #000; z-index: 99999;
            opacity: 0; pointer-events: none;
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            transition: opacity 0.6s ease, backdrop-filter 0.6s ease;
        }
        .page-transition-overlay.active {
            opacity: 1; pointer-events: auto;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        /* ================= 雪花特效层 ================= */
        .snow-container {
            position: fixed; inset: 0; z-index: 10;
            overflow: hidden; pointer-events: none; 
            transition: opacity 1.5s ease, filter 1.5s ease;
            opacity: 0; filter: blur(10px); animation: snowFadeIn 1.5s ease forwards;
        }
        @keyframes snowFadeIn { to { opacity: 1; filter: blur(0); } }
        .snow-container.fade-out { opacity: 0 !important; filter: blur(10px) !important; animation: none !important; }

        .snowflake-complex {
            position: absolute; top: -10vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g stroke="white" stroke-width="2" stroke-linecap="round" fill="none"><line x1="50" y1="5" x2="50" y2="95"/><line x1="11" y1="27.5" x2="89" y2="72.5"/><line x1="89" y1="27.5" x2="11" y2="72.5"/><line x1="50" y1="25" x2="35" y2="10"/><line x1="50" y1="25" x2="65" y2="10"/><line x1="50" y1="75" x2="35" y2="90"/><line x1="50" y1="75" x2="65" y2="90"/><line x1="27.5" y1="40" x2="15" y2="35"/><line x1="72.5" y1="60" x2="85" y2="65"/><line x1="72.5" y1="40" x2="85" y2="35"/><line x1="27.5" y1="60" x2="15" y2="65"/></g></svg>');
            background-size: contain; background-repeat: no-repeat;
            will-change: transform, opacity; animation: fall linear infinite;
        }
        .snowflake-dot {
            position: absolute; top: -10vh; background-color: #fff; border-radius: 50%;
            will-change: transform, opacity; animation: fallDot linear infinite;
        }
        @keyframes fall {
            0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
            10% { opacity: var(--target-opacity); }
            90% { opacity: var(--target-opacity); }
            100% { transform: translate3d(20vw, 110vh, 0) rotate(360deg); opacity: 0; }
        }
        @keyframes fallDot {
            0% { transform: translate3d(0, -10vh, 0); opacity: 0; }
            10% { opacity: var(--target-opacity); }
            90% { opacity: var(--target-opacity); }
            100% { transform: translate3d(10vw, 110vh, 0); opacity: 0; }
        }

        /* ================= 文本轻微抖雪特效 ================= */
        .snow-drop-particle {
            position: fixed; background: #fff; border-radius: 50%; pointer-events: none;
            z-index: 10000; box-shadow: 0 0 2px rgba(255,255,255,0.5);
            animation: textDropDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes textDropDown {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0; }
        }

        @keyframes textShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
        }
        .shake-effect { animation: textShake 0.3s ease-in-out; }

        /* 播放器背景 */
        .app-container {
            width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
            background-image: url('背景底.jpg'); background-size: cover; background-position: center;
            z-index: 2;
        }
        .app-container::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.9) 100%); z-index: 0;
        }

        /* ================= 顶部导航栏 ================= */
        .top-bar { 
            height: 60px; display: flex; align-items: center; justify-content: space-between; 
            padding: 10px 20px; z-index: 100; flex-shrink: 0; position: relative;
        }
        
        .nav-icon-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0.8; transition: 0.3s;
        }
        .nav-icon-btn:hover { opacity: 1; }
        .nav-icon-btn svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        /* 搜索框 (居中) */
        .search-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 200px; }
        .search-box {
            display: flex; align-items: center; width: 100%; height: 32px;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px; padding: 0 12px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            cursor: pointer; transition: all 0.3s;
        }
        .search-box:hover { background: rgba(255, 255, 255, 0.25); }
        .search-input { background: none; border: none; outline: none; color: #fff; font-size: 12px; width: 100%; cursor: pointer; text-align: center; }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.6); }

        /* ================= 下拉菜单 (玻璃拟物化优化) ================= */
        .search-dropdown {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%) translateY(-10px);
            width: 150px; 
            /* 核心改动：高通透玻璃背景 + 强模糊 */
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.25); /* 增加高光边框 */
            border-radius: 14px; 
            backdrop-filter: blur(20px) saturate(150%); 
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 10px rgba(255,255,255,0.1); /* 增加内发光和外阴影 */
            opacity: 0; visibility: hidden; transition: all 0.3s;
            overflow: hidden; z-index: 100;
        }
        .search-dropdown.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        
        .dropdown-item { 
            padding: 12px 15px; font-size: 13px; display: flex; align-items: center; gap: 8px; 
            cursor: pointer; transition: background 0.2s; color: #fff;
        }
        .dropdown-item:hover { background: rgba(255, 255, 255, 0.15); } /* 悬停时稍微提亮 */
        .dropdown-item:not(:last-child) { border-bottom: 1px solid rgba(255, 255, 255, 0.1); } /* 更明显的分割线 */
        
        .mini-snow-icon { width: 14px; height: 14px; stroke: #fff; stroke-width: 1.5; fill: none; }

        /* ================= 主体内容区 ================= */
        .main-content {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; position: relative; padding: 0 30px; overflow: hidden;
        }

        /* 黑胶唱片容器 */
        .vinyl-wrapper {
            position: relative; 
            width: 260px; 
            height: 260px; 
            aspect-ratio: 1 / 1;
            border-radius: 50%; 
            cursor: pointer; 
            margin-top: 10px; 
            margin-bottom: 15px;
            box-shadow: 0 0 40px rgba(255,255,255,0.05), inset 0 0 20px rgba(0,0,0,0.9); 
            background: #111;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .vinyl-bg {
            width: 100%; height: 100%; background-image: url('黑胶.jpg'); background-size: cover; background-position: center;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            will-change: transform; animation: spin 20s linear infinite; animation-play-state: paused; transform: scale(1.02);
        }
        .vinyl-bg.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: scale(1.02) rotate(360deg); } }

        .album-cover {
            width: 65%; height: 65%; border-radius: 50%; background-image: url('封面占位.jpg');
            background-size: cover; background-position: center; position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .album-cover::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; background: #0a0a0a; border-radius: 50%;
        }

        /* 黑胶下方的互动文本 */
        .interactive-text {
            font-size: 13px;
            font-weight: 300; 
            color: #fff;
            letter-spacing: 2px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5); 
            animation: breatheOpacity 3s infinite alternate ease-in-out;
        }
        @keyframes breatheOpacity {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ================= 信息与文本区 ================= */
        .info-section {
            width: 100%; display: flex; flex-direction: column; align-items: flex-start;
            margin-bottom: 10px; cursor: pointer;
        }

        .tags-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .tag-pill {
            background: rgba(255,255,255,0.1); border-radius: 20px;
            padding: 3px 8px; font-size: 10px; color: rgba(255,255,255,0.7);
            display: flex; align-items: center; gap: 4px;
        }
        .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: #4cd964; }

        .song-info { margin-bottom: 5px; width: 100%;}
        .art-title-container {
            font-size: 20px; font-weight: 600; letter-spacing: 2px; line-height: 1.3;
            display: flex; flex-direction: column;
        }
        .title-line { display: block; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
        .line-1 { margin-left: 0; }
        .line-2 { margin-left: 15px; margin-top: 4px; font-size: 18px; }
        
        .title-en-container {
            font-size: 10px; font-weight: 300; color: rgba(255, 255, 255, 0.6); letter-spacing: 1px;
            margin-top: 8px; margin-left: 2px; display: flex; flex-direction: column;
        }
        .en-line-2 { margin-left: 15px; margin-top: 2px; }

        .char-anim {
            display: inline-block; opacity: 0; transform: translateY(10px); filter: blur(8px);
            animation: blurReveal 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes blurReveal {
            0% { opacity: 0; transform: translateY(10px); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .artist-row {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; margin-bottom: 20px;
        }
        .artist-info { display: flex; align-items: center; gap: 8px; }
        .artist-name { font-size: 13px; color: #ddd; }
        .artist-tag { font-size: 10px; border: 1px solid rgba(255,255,255,0.3); padding: 2px 6px; border-radius: 10px; color: rgba(255,255,255,0.7); }
        
        .action-icons { display: flex; gap: 15px; align-items: center; }
        
        .comment-action-btn { 
            display: flex; align-items: center; gap: 4px; color: #ccc; font-size: 13px; 
            cursor: pointer; transition: 0.3s;
        }
        .comment-action-btn:hover { color: #fff; }
        .comment-action-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }

        .heart-btn { display: flex; align-items: center; gap: 4px; color: #ff4757; font-size: 13px; font-weight: bold;}
        .heart-btn svg { width: 20px; height: 20px; fill: #ff4757; }

        /* ================= 进度条与控制区 ================= */
        .progress-area { width: 100%; display: flex; flex-direction: column; margin-bottom: 15px; }
        .progress-bar-bg {
            width: 100%; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px;
            position: relative; cursor: pointer;
        }
        .progress-bar-current {
            position: absolute; left: 0; top: 0; height: 100%; width: 10%;
            background: #fff; border-radius: 2px;
        }
        .progress-bar-thumb {
            position: absolute; left: 10%; top: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .time-row {
            display: flex; justify-content: space-between; width: 100%; margin-top: 6px;
            font-size: 10px; color: rgba(255,255,255,0.5);
        }

        .controls-row {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 0 10px;
        }
        .ctrl-btn { background: none; border: none; cursor: pointer; opacity: 0.8; transition: 0.2s; }
        .ctrl-btn:hover { opacity: 1; }
        .ctrl-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        
        .play-btn-large {
            width: 46px; height: 46px; display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .play-btn-large svg { width: 36px; height: 36px; fill: rgba(255,255,255,0.9); stroke: none; }
        
        .bottom-func-row {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; padding: 0 20px;
        }
        .func-btn { background: none; border: none; cursor: pointer; opacity: 0.6; }
        .func-btn:hover { opacity: 1; }
        .func-btn svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .snow-toggle-btn {
            position: absolute; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 6px 12px; border-radius: 15px; font-size: 12px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 5px;
            backdrop-filter: blur(5px);
        }
        .snow-toggle-btn:hover { background: rgba(255,255,255,0.2); }
        .snow-toggle-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; }

        .lyrics-container {
            position: absolute; inset: 0; background: rgba(10,15,20,0.85); backdrop-filter: blur(10px);
            z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 50px 0;
        }
        .lyrics-container.show { display: flex; }
        .lyrics-list { height: 60%; overflow: hidden; position: relative; width: 100%; text-align: center;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }
        .lyric-line { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 25px; transition: 0.3s; }
        .lyric-line.active { color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
        .close-lyrics { position: absolute; top: 20px; right: 20px; cursor: pointer; padding: 10px; }

        /* ================= 论坛体评论区 ================= */
        .comment-modal {
            position: fixed; top: auto; bottom: 0; left: 0; width: 100%; height: 65vh; 
            background: rgba(25, 25, 35, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.2); border-radius: 24px 24px 0 0;
            z-index: 9999; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .comment-modal.show { transform: translateY(0); }
        .modal-header { height: 50px; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
        .modal-header::before { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; }
        .modal-header .close-btn { position: absolute; left: 20px; top: 15px; color: #fff; font-size: 20px; background: none; border: none; cursor: pointer; opacity: 0.8; }
        .modal-header .title { font-size: 15px; font-weight: 600; margin-top: 10px; }
        .modal-comment-list { flex: 1; overflow-y: auto; padding: 0; }
        
        .tweet-main { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; gap: 12px; }
        .tweet-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;}
        .tweet-content { flex: 1; }
        .tweet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .tweet-user-info { display: flex; gap: 5px; align-items: center; }
        .tweet-name { font-weight: bold; font-size: 15px; color: #fff; }
        .tweet-handle { font-size: 14px; color: rgba(255,255,255,0.5); }
        .tweet-dots { color: rgba(255,255,255,0.5); cursor: pointer; }
        .tweet-text { font-size: 15px; color: #e7e9ea; line-height: 1.4; margin-bottom: 12px; word-break: break-all; }
        .tweet-date { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }
        .tweet-date span { color: #fff; font-weight: bold; margin-right: 5px; }
        .tweet-stats { border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 0; display: flex; gap: 20px; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
        .tweet-stats span { color: #fff; font-weight: bold; }
        .tweet-actions { display: flex; justify-content: space-between; color: rgba(255,255,255,0.5); padding: 0 10px; }
        .action-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; transition: color 0.2s; background: none; border: none; padding: 5px; }
        .action-btn svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
        .action-btn.reply:hover { color: #1d9bf0; }
        .action-btn.like:hover { color: #f91880; }
        .action-btn.like.liked { color: #f91880; }
        .action-btn.like.liked svg { animation: heartPop 0.3s ease-in-out; }
        @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .tweet-replies { padding-bottom: 20px; }
        .reply-item { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; gap: 12px; }
        
        .modal-input-area { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; background: transparent; padding-bottom: calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; }
        .modal-input-area input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; font-size: 15px; }
        .modal-input-area input::placeholder { color: rgba(255,255,255,0.4); }
        .modal-input-area button { background: #fff; color: #000; border: none; border-radius: 20px; padding: 0 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }

        /* ================= 手机端专属高度与布局舒展优化 ================= */
        @media (max-width: 768px) {
            .main-content { padding: 0 20px; justify-content: flex-start; padding-top: 10px; }
            .vinyl-wrapper { width: 200px; height: 200px; margin-top: 5px; margin-bottom: 10px; }
            .interactive-text { margin-bottom: 15px; font-size: 12px; letter-spacing: 1px; }
            
            .tags-row { margin-bottom: 8px; }
            .song-info { margin-bottom: 2px; }
            .art-title-container { font-size: 18px; }
            .line-2 { font-size: 16px; margin-left: 10px; margin-top: 2px; }
            .title-en-container { margin-top: 5px; }
            
            .artist-row { margin-top: 8px; margin-bottom: 12px; }
            
            /* 进度条与控制区舒展优化 */
            .progress-area { margin-bottom: 15px; }
            .controls-row { margin-bottom: 20px; padding: 0 15px; gap: 15px; } 
            .ctrl-btn svg { width: 24px; height: 24px; } 
            .play-btn-large { width: 50px; height: 50px; } 
            .play-btn-large svg { width: 42px; height: 42px; }
            
            .bottom-func-row { margin-bottom: 10px; padding: 0 20px; } 
            .func-btn svg { width: 20px; height: 20px; } 
            
            .snow-toggle-btn { bottom: 15px; right: 15px; padding: 5px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- 快速黑色开场淡出 -->
    <div class="intro-black-screen"></div>

    <!-- 全局模糊遮罩 -->
    <div class="page-transition-overlay" id="page-transition-overlay"></div>

    <!-- 雪花层 -->
    <div class="snow-container" id="snow-container"></div>

    <div class="app-container">
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="nav-icon-btn" onclick="window.history.back()">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            
            <div class="search-wrapper">
                <div class="search-box" onclick="toggleSearch()">
                    <input type="text" class="search-input" placeholder="我喜欢的音乐" readonly>
                </div>
                <div class="search-dropdown" id="search-dropdown">
                    <div class="dropdown-item" onclick="goToPage('关于我.html')">

    <script>
        // 定义播放和暂停的 SVG 图标
        const playIconSVG = '<svg viewBox="0 0 24 24" style="fill: rgba(255,255,255,0.9); stroke: none;"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
        const pauseIconSVG = '<svg viewBox="0 0 24 24" style="fill: rgba(255,255,255,0.9); stroke: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

        // ================= 1. 飘雪控制逻辑 =================
        let isSnowing = true;
        function createSnow() {
            const container = document.getElementById('snow-container');
            const isMobile = window.innerWidth <= 768;
            
            const complexCount = isMobile ? 5 : 10; 
            const dotCount = isMobile ? 40 : 100; 

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < complexCount; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake-complex');
                const size = Math.random() * 15 + 10;
                snow.style.width = `${size}px`;
                snow.style.height = `${size}px`;
                snow.style.left = `${Math.random() * 100}vw`;
                const duration = Math.random() * 15 + 15;
                snow.style.animationDuration = `${duration}s`;
                snow.style.animationDelay = `-${Math.random() * 30}s`;
                snow.style.setProperty('--target-opacity', Math.random() * 0.4 + 0.3);
                fragment.appendChild(snow);
            }

            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.classList.add('snowflake-dot');
                const size = Math.random() * 3.5 + 1.5;
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${Math.random() * 100}vw`;
                const duration = Math.random() * 10 + 8;
                dot.style.animationDuration = `${duration}s`;
                dot.style.animationDelay = `-${Math.random() * 20}s`;
                dot.style.setProperty('--target-opacity', Math.random() * 0.6 + 0.2);
                if (Math.random() > 0.5) {
                    dot.style.filter = `blur(${Math.random() * 1.5 + 0.5}px)`;
                }
                fragment.appendChild(dot);
            }
            
            container.appendChild(fragment);
        }
        
        window.addEventListener('load', () => {
            setTimeout(createSnow, 100);
        });

        function toggleSnow() {
            const container = document.getElementById('snow-container');
            const btn = document.getElementById('snow-toggle');
            
            if (isSnowing) {
                container.classList.add('fade-out');
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/></svg> 开启飘雪';
                isSnowing = false;
            } else {
                container.classList.remove('fade-out');
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93L4.93 19.07"/></svg> 关闭飘雪';
                isSnowing = true;
            }
        }

        // ================= 2. 文本轻微抖雪 & 沙沙音效 =================
        let audioCtx = null;
        
        function playSnowSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const bufferSize = audioCtx.sampleRate * 0.5; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1500, audioCtx.currentTime); 
                filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.4);
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noise.start();
            } catch(e) { console.log("Audio error", e); }
        }

        // 抖雪特效专用 (只播放音效和粒子，不跳转)
        function triggerTextSnow(event, elementId) {
            if(event) event.stopPropagation();
            playSnowSound();
            
            const element = document.getElementById(elementId);
            if (!element) return;

            element.classList.remove('shake-effect');
            void element.offsetWidth; 
            element.classList.add('shake-effect');

            const rect = element.getBoundingClientRect();
            const particleCount = 20; 
            
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('snow-drop-particle');
                
                const startX = rect.left + Math.random() * rect.width;
                const startY = rect.top + Math.random() * rect.height;
                
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                
                const size = Math.random() * 4 + 2; 
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                
                const fallY = Math.random() * 40 + 20; 
                const fallX = (Math.random() - 0.5) * 20; 
                
                p.style.setProperty('--ty', fallY + 'px');
                p.style.setProperty('--tx', fallX + 'px');
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }

            // 文字点击直接呼出歌词
            toggleLyrics(event);
        }

        // 点击黑胶和互动文字时，触发音效、粒子并跳转
        function triggerSnowEffectAndGo(event, url) {
            if(event) event.stopPropagation();
            playSnowSound(); // 播放沙沙声
            
            const x = event.clientX || window.innerWidth / 2;
            const y = event.clientY || window.innerHeight / 2;
            
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.classList.add('snow-drop-particle');
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                const size = Math.random() * 4 + 2; 
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                const fallY = Math.random() * 60 + 30; 
                const fallX = (Math.random() - 0.5) * 40; 
                p.style.setProperty('--ty', fallY + 'px');
                p.style.setProperty('--tx', fallX + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
            
            setTimeout(() => {
                goToPage(url);
            }, 300);
        }

        // 歌词显示隐藏逻辑
        function toggleLyrics(event) {
            if(event) event.stopPropagation();
            const container = document.getElementById('lyrics-container');
            container.classList.toggle('show');
        }

        // ================= 3. 全局模糊跳转逻辑 =================
        function goToPage(url) {
            const overlay = document.getElementById('page-transition-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                window.location.href = url;
            }, 600);
        }

        function toggleSearch(event) {
            if(event) event.stopPropagation();
            const dropdown = document.getElementById('search-dropdown');
            dropdown.classList.toggle('show');
        }
        document.addEventListener('click', function(event) {
            const wrapper = document.querySelector('.search-wrapper');
            const dropdown = document.getElementById('search-dropdown');
            if (!wrapper.contains(event.target) && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        });

        // ================= 4. 音乐与歌词逻辑 =================
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const vinyl = document.getElementById('vinyl');

        function initAudioPlay() {
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playBtn.innerHTML = pauseIconSVG; 
                    vinyl.classList.add('playing');
                }).catch(error => {
                    playBtn.innerHTML = playIconSVG; 
                    document.body.addEventListener('click', function initPlay() {
                        if (audio.paused) {
                            audio.play();
                            playBtn.innerHTML = pauseIconSVG;
                            vinyl.classList.add('playing');
                        }
                        document.body.removeEventListener('click', initPlay);
                    }, { once: true });
                });
            }
        }

        document.addEventListener('DOMContentLoaded', initAudioPlay);

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = pauseIconSVG;
                vinyl.classList.add('playing');
            } else {
                audio.pause();
                playBtn.innerHTML = playIconSVG;
                vinyl.classList.remove('playing');
            }
        }

        const lyricsList = document.getElementById('lyrics-list');
        const lyricsData = [
            { time: 0, text: "太聪明 - 陈绮贞" }, { time: 15, text: "总以为谜一般难懂的我" },
            { time: 21, text: "在你了解了以后 其实也没什么" }, { time: 28, text: "我总是忽冷又忽热隐藏我的感受" },
            { time: 35, text: "只是怕爱你的心被你看透" }, { time: 44, text: "猜得没错 想得太多 不会有结果" },
            { time: 51, text: "被你看穿了以后 我更无处可躲" }, { time: 58, text: "我开始后悔不应该太聪明的卖弄" },
            { time: 65, text: "只是怕亲手将我的真心葬送" }, { time: 75, text: "我猜着你的心 要再一次决定" },
            { time: 82, text: "遥远的距离 都是因为太过聪明" }
        ];
        let currentLyricIndex = -1;

        function initLyrics() {
            lyricsData.forEach((lyric, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line'; div.innerText = lyric.text; div.id = `lyric-${index}`; lyricsList.appendChild(div);
            });
        }

        // 更新进度条和时间
        const progressCurrent = document.getElementById('progress-current');
        const progressThumb = document.getElementById('progress-thumb');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function formatTime(seconds) {
            if(isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            timeTotal.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration || 1;
            
            // 进度条
            const percent = (currentTime / duration) * 100;
            progressCurrent.style.width = `${percent}%`;
            progressThumb.style.left = `${percent}%`;
            timeCurrent.innerText = formatTime(currentTime);

            // 歌词
            for (let i = lyricsData.length - 1; i >= 0; i--) {
                if (currentTime >= lyricsData[i].time) {
                    if (currentLyricIndex !== i) { updateLyricHighlight(i); currentLyricIndex = i; }
                    break;
                }
            }
        });

        function updateLyricHighlight(index) {
            document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
            const activeLine = document.getElementById(`lyric-${index}`);
            if (activeLine) {
                activeLine.classList.add('active');
                const containerHeight = document.querySelector('.lyrics-list').clientHeight;
                const lineTop = activeLine.offsetTop;
                const translateY = -(lineTop - (containerHeight / 2) + (activeLine.clientHeight / 2));
                lyricsList.style.transform = `translateY(${translateY}px)`;
            }
        }

        // ================= 5. 评论区逻辑 =================
        function openComments(event) {
            if(event) event.stopPropagation();
            document.getElementById('comment-modal').classList.add('show');
            let views = document.querySelector('.tweet-date span');
            let num = parseFloat(views.innerText); 
            if(!isNaN(num)) views.innerText = (num + 0.01).toFixed(2) + '万';
        }
        function closeComments() { document.getElementById('comment-modal').classList.remove('show'); }
        function focusInput() { document.getElementById('comment-input').focus(); }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            const span = btn.querySelector('span'); let count = parseInt(span.innerText.replace(/,/g, ''));
            if (btn.classList.contains('liked')) { count++; btn.querySelector('svg').style.fill = '#f91880'; }
            else { count--; btn.querySelector('svg').style.fill = 'currentColor'; }
            span.innerText = count > 10000 ? (count/10000).toFixed(1) + '万' : count;
        }

        function addComment() {
            const input = document.getElementById('comment-input'); const text = input.value.trim();
            if (text) {
                const list = document.querySelector('.tweet-replies');
                const newComment = document.createElement('div'); newComment.className = 'reply-item';
                const now = new Date(); const timeStr = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                newComment.innerHTML = `
                    <img src="留言者头像.jpg" alt="avatar" class="tweet-avatar">
                    <div class="tweet-content">
                        <div class="tweet-header">
                            <div class="tweet-user-info"><span class="tweet-name">.</span><span class="tweet-handle">@me · ${timeStr}</span></div>
                            <div class="tweet-dots">···</div>
                        </div>
                        <div style="font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 5px;">回复 <span style="color:#1d9bf0">@Ec*</span></div>
                        <div class="tweet-text" style="font-size: 14px;">${text}</div>
                        <div class="tweet-actions" style="margin-top: 8px;">
                            <button class="action-btn reply" onclick="focusInput()"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></svg><span>0</span></button>
                            <button class="action-btn like" onclick="toggleLike(this)"><svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"></path></svg><span>0</span></button>
                        </div>
                    </div>
                `;
                list.appendChild(newComment); input.value = '';
                const modalList = document.getElementById('comment-list'); 
                modalList.scrollTop = modalList.scrollHeight;
            }
        }
        document.getElementById('comment-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') addComment(); });

        initLyrics();
    </script>
</body>
</html>
