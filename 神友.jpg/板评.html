<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>留言板 - 笗白</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #fff; background-color: #000;
        }

        /* ================= 快速闪黑进场 ================= */
        .intro-black-screen {
            position: fixed; inset: 0;
            background: #000;
            z-index: 999999;
            pointer-events: none;
            animation: introFadeOut 0.6s ease forwards;
        }
        @keyframes introFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ================= 飘雪特效层 ================= */
        .snow-container {
            position: fixed; inset: 0; z-index: 10; overflow: hidden; pointer-events: none;
            opacity: 0; animation: snowFadeIn 2s ease forwards;
        }
        @keyframes snowFadeIn { to { opacity: 1; } }
        
        .snowflake-complex {
            position: absolute; top: -10vh;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g stroke="white" stroke-width="2" stroke-linecap="round" fill="none"><line x1="50" y1="5" x2="50" y2="95"/><line x1="11" y1="27.5" x2="89" y2="72.5"/><line x1="89" y1="27.5" x2="11" y2="72.5"/><line x1="50" y1="25" x2="35" y2="10"/><line x1="50" y1="25" x2="65" y2="10"/><line x1="50" y1="75" x2="35" y2="90"/><line x1="50" y1="75" x2="65" y2="90"/><line x1="27.5" y1="40" x2="15" y2="35"/><line x1="72.5" y1="60" x2="85" y2="65"/><line x1="72.5" y1="40" x2="85" y2="35"/><line x1="27.5" y1="60" x2="15" y2="65"/></g></svg>');
            background-size: contain; background-repeat: no-repeat;
            will-change: transform, opacity; animation: fall linear infinite;
        }
        .snowflake-dot {
            position: absolute; top: -10vh; background-color: #fff; border-radius: 50%;
            will-change: transform, opacity; animation: fallDot linear infinite;
        }
        @keyframes fall {
            0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
            10% { opacity: var(--target-opacity); }
            90% { opacity: var(--target-opacity); }
            100% { transform: translate3d(20vw, 110vh, 0) rotate(360deg); opacity: 0; }
        }
        @keyframes fallDot {
            0% { transform: translate3d(0, -10vh, 0); opacity: 0; }
            10% { opacity: var(--target-opacity); }
            90% { opacity: var(--target-opacity); }
            100% { transform: translate3d(10vw, 110vh, 0); opacity: 0; }
        }

        /* 页面暗色背景 */
        .app-container {
            min-height: 100%; position: relative; display: flex; flex-direction: column;
            background-image: url('背景底.jpg'); background-size: cover; background-position: center;
            background-attachment: fixed;
        }
        .app-container::before {
            content: ''; position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(15, 15, 20, 0.85) 0%, rgba(5, 5, 10, 0.98) 100%); z-index: 0;
        }

        /* 顶部导航 */
        .top-nav {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 20px;
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn {
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: flex-start;
            cursor: pointer; opacity: 0.8;
        }
        .back-btn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-title { font-size: 16px; font-weight: 600; color: #eee; letter-spacing: 1px; }

        /* ================= 顶部提示文本 ================= */
        .top-hint-container {
            text-align: center;
            padding: 20px 15px 5px;
            position: relative;
            z-index: 10;
        }
        .top-hint-text {
            font-size: 13px;
            font-weight: 300;
            color: #fff;
            letter-spacing: 5px;
            opacity: 0.85;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* 主容器 */
        .main-content {
            position: relative; z-index: 10;
            max-width: 600px; margin: 0 auto; width: 100%;
            padding: 10px 15px 100px;
        }

        /* ================= 楼主区域 ================= */
        .post-author {
            display: flex; align-items: flex-start; gap: 15px;
            margin-bottom: 20px;
        }
        .author-avatar {
            width: 50px; height: 50px; border-radius: 50%; object-fit: cover;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        .author-avatar:active { transform: scale(0.95); }
        
        .author-info { flex: 1; }
        .author-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .author-name { font-size: 16px; font-weight: bold; color: #fff; }
        .author-id { font-size: 13px; color: #888; margin-left: 5px; font-weight: normal; }
        
        .follow-btn {
            border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
            padding: 4px 15px; font-size: 12px; color: #fff; cursor: pointer;
            background: transparent; transition: 0.3s;
        }
        .follow-btn.followed { background: rgba(255,255,255,0.1); border-color: transparent; color: #888; }

        /* 文案 */
        .post-text {
            font-size: 15px; line-height: 1.8; color: #ddd;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        .post-tags { 
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; 
        }
        .post-tags span {
            color: #6da6f2; font-size: 14px;
        }

        /* 统计数据 */
        .post-stats {
            display: flex; gap: 20px; padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 13px; color: #888;
        }
        .post-stats span { color: #fff; font-weight: bold; margin-right: 3px; }

        /* ================= 走马灯留言板 ================= */
        .marquee-section {
            margin: 25px 0; padding: 30px 0;
            overflow: hidden; position: relative;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .marquee-track {
            display: flex; gap: 20px; width: max-content;
            align-items: center;
            animation: marqueeMove 35s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }
        
        @keyframes marqueeMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .glass-bubble {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 24px; border-radius: 30px;
            font-size: 14px; color: #eee; white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        /* 错落排版 */
        .glass-bubble:nth-child(3n+1) { transform: translateY(-12px); }
        .glass-bubble:nth-child(3n+2) { transform: translateY(8px); }
        .glass-bubble:nth-child(3n) { transform: translateY(-4px); }

        /* ================= 评论区 ================= */
        .comments-section {
            display: flex; flex-direction: column; gap: 0;
        }
        .comment-item {
            display: flex; gap: 12px; padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: commentSlideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes commentSlideIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .comment-avatar {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
        }
        .comment-content { flex: 1; }
        
        .comment-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 5px;
        }
        .comment-user { font-size: 14px; font-weight: bold; color: #ddd; }
        .comment-time { font-size: 12px; color: #666; }
        
        .comment-text {
            font-size: 14px; line-height: 1.6; color: #bbb;
            margin-bottom: 10px; word-break: break-word;
        }

        .comment-actions {
            display: flex; gap: 25px; font-size: 13px; color: #666;
        }
        .action-btn {
            display: flex; align-items: center; gap: 5px;
            cursor: pointer; transition: color 0.2s;
        }
        .action-btn:hover { color: #fff; }
        .action-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
        .action-btn.liked { color: #f91880; }
        .action-btn.liked svg { fill: #f91880; stroke: #f91880; animation: heartPop 0.3s ease; }
        @keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* ================= 底部输入区 ================= */
        .input-area {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex; gap: 10px; z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .input-area input {
            flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; padding: 10px 15px; color: #fff; font-size: 14px; outline: none;
            transition: background 0.3s;
        }
        .input-area input:focus { background: rgba(255,255,255,0.15); }
        .input-area input::placeholder { color: #888; }
        .send-btn {
            background: #4a90e2; color: #fff; border: none; border-radius: 20px;
            padding: 0 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .send-btn:active { transform: scale(0.95); }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-content { padding: 10px 15px 100px; }
            .author-avatar { width: 45px; height: 45px; }
            .post-text { font-size: 14px; }
            .comment-text { font-size: 13px; }
            .marquee-section { padding: 25px 0; }
            .glass-bubble { font-size: 13px; padding: 10px 18px; }
        }
    </style>
</head>
<body>

    <!-- 快速黑色开场淡出 -->
    <div class="intro-black-screen"></div>

    <!-- 雪花层 -->
    <div class="snow-container" id="snow-container"></div>

    <div class="app-container">
        <!-- 顶部导航，返回键已修改为跳转至播放器.html -->
        <div class="top-nav">
            <div class="back-btn" onclick="window.location.href='播放器.html'">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </div>
            <div class="nav-title">帖子</div>
            <div style="width: 30px;"></div> <!-- 占位 -->
        </div>

        <!-- 顶部细体白色文本 -->
        <div class="top-hint-container">
            <div class="top-hint-text">轻触头像进入主页</div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            
            <!-- 楼主区域 -->
            <div class="post-author">
                <img src="头像1.jpg" class="author-avatar" onclick="window.location.href='关于我.html'">
                <div class="author-info">
                    <div class="author-header">
                        <div>
                            <span class="author-name">笗白</span>
                            <span class="author-id">@DongBai</span>
                        </div>
                        <button class="follow-btn" id="follow-btn" onclick="toggleFollow()">关注</button>
                    </div>
                    <div class="post-text">
                        你好像瘦了 头发也变长了<br>
                        背影陌生到让我觉得<br>
                        见你好像是上个世纪的事<br>
                        然后你开口叫我的名字<br>
                        我就想笑<br>
                        好像自己刚刚放学 只在门口等了你五分钟而已
                    </div>
                    <div class="post-tags">
                        <span>#INFJ</span>
                        <span>#巨蟹</span>
                        <span>#直</span>
                        <span>#稳定四无</span>
                    </div>
                </div>
            </div>

            <!-- 统计数据 -->
            <div class="post-stats">
                <div><span>24</span> 转发</div>
                <div><span>112</span> 引用</div>
                <div><span>999+</span> 喜欢</div>
            </div>

            <!-- 走马灯留言板 -->
            <div class="marquee-section">
                <div class="marquee-track" id="marquee-track">
                    <!-- JS 动态注入 -->
                </div>
            </div>

            <!-- 评论列表 -->
            <div class="comments-section" id="comments-list">
                <!-- JS 动态注入 -->
            </div>

        </div>

        <!-- 底部输入框 -->
        <div class="input-area">
            <input type="text" id="comment-input" placeholder="说点什么...">
            <button class="send-btn" onclick="addComment()">发送</button>
        </div>
    </div>

    <!-- 音乐播放 -->
    <audio id="bgm" src="CrossTheGalaxy - 冬日圆舞曲.flac" loop autoplay></audio>

    <script>
        // ================= 0. 音乐自动播放控制 =================
        const bgm = document.getElementById('bgm');
        
        function tryPlayAudio() {
            let playPromise = bgm.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("自动播放被拦截，等待用户交互");
                    document.body.addEventListener('click', function initPlay() {
                        if (bgm.paused) bgm.play();
                        document.body.removeEventListener('click', initPlay);
                    }, { once: true });
                });
            }
        }

        window.addEventListener('load', tryPlayAudio);
        document.addEventListener('DOMContentLoaded', tryPlayAudio);

        // ================= 1. 雪花特效 =================
        function createSnow() {
            const container = document.getElementById('snow-container');
            const isMobile = window.innerWidth <= 768;
            const complexCount = isMobile ? 8 : 15;
            const dotCount = isMobile ? 40 : 80;

            for (let i = 0; i < complexCount; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake-complex');
                const size = Math.random() * 15 + 8;
                snow.style.width = `${size}px`;
                snow.style.height = `${size}px`;
                snow.style.left = `${Math.random() * 100}vw`;
                const duration = Math.random() * 20 + 25; 
                snow.style.animationDuration = `${duration}s`;
                snow.style.animationDelay = `-${Math.random() * 40}s`;
                snow.style.setProperty('--target-opacity', Math.random() * 0.5 + 0.2);
                container.appendChild(snow);
            }

            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.classList.add('snowflake-dot');
                const size = Math.random() * 3 + 1.5;
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${Math.random() * 100}vw`;
                const duration = Math.random() * 12 + 18;
                dot.style.animationDuration = `${duration}s`;
                dot.style.animationDelay = `-${Math.random() * 30}s`;
                dot.style.setProperty('--target-opacity', Math.random() * 0.7 + 0.2);
                container.appendChild(dot);
            }
        }
        createSnow();

        // ================= 2. 关注按钮 =================
        let isFollowed = false;
        function toggleFollow() {
            const btn = document.getElementById('follow-btn');
            isFollowed = !isFollowed;
            if (isFollowed) {
                btn.innerText = '已关注';
                btn.classList.add('followed');
            } else {
                btn.innerText = '关注';
                btn.classList.remove('followed');
            }
        }

        // ================= 3. 走马灯留言板 =================
        const marqueeData = [
            "我的城市下雪了。",
            "你和雪有一个共同特点。",
            "今天也很想你。",
            "天冷了记得加衣。",
            "好久不见。"
        ];

        function initMarquee() {
            const track = document.getElementById('marquee-track');
            let html = '';
            for(let loop=0; loop<2; loop++) {
                marqueeData.forEach(text => {
                    html += `<div class="glass-bubble">${text}</div>`;
                });
            }
            track.innerHTML = html;
        }
        initMarquee();

        // ================= 4. 评论区数据与渲染 =================
        const initialComments = [
            {
                name: "匿名用户",
                time: "2月25日 晚上10:57",
                text: "第一次点虚恋第一次写评论hh，语言比较匮乏。在等待的时候就已经开始期待了！怕接不上话还特意去网上搜了很多接话小妙招(。•́︿•̀。)<br><br>举报！这个笗白在发好友码的时候就开始勾引我了，钓钓的，很会撩，全程引导接话也很好！完全不用担心，根本不会冷场，全程也很有逻辑性超级连贯，不会让人觉得有些莫名其妙。选的地点也好看！互动感很强，感觉在谈一场甜甜的恋爱超级喜欢——开始其实有点羞耻来着，笗白也很快察觉到我的情绪并且快速救场，后面越来越放开了hhh<br><br>收尾也很好，很意想不到的一个收尾，就是我有点戒断反应了🚩，很好吃(๑>؂<๑)。祝宝宝爆单呀很高兴遇见你，和你相遇我很幸运。",
                likes: 88
            },
            {
                name: "叙野",
                time: "昨天 00:50",
                text: "或期许 或密布纠葛<br>裹挟着易碎的心脏<br>盘根错节是我们的指尖<br><br>若是承诺作数<br>你要以最谦卑的姿态附身<br>奉上虔诚一吻<br>和你手中打破永恒的刀刃",
                likes: 77
            },
            {
                name: "千绪",
                time: "10分钟前",
                text: "见面会根据动作形态来开场，很容易让人心生好感，说的话也会很好地接住，相处的时候真的很容易被你骗到，一开始喊姐姐看着乖乖软软，一副好拿捏的样子，想让人欺负，但乖乖只是表面，心里其实是腹黑的，会故意漏出来给你看，这种反差感谁不爱！",
                likes: 128
            },
            {
                name: "拾清",
                time: "30分钟前",
                text: "第一次点虚恋，这个笗白完全满分啊！全程都超级自然，此人简直是气氛轻松暧昧感的神！好幸福，美味美味我直接吻上好吧🥰节奏也把握得很好，由于个人原因觉得自己可能接不上话加的半单口，发现都很好接啊，而且我没回复时也会反应接话，完全没有冷场尴尬的机会。",
                likes: 256
            },
            {
                name: "Kt",
                time: "1小时前",
                text: "坏了完全坏了，我从未见过如此迷人的女人。气氛轻松舒服的有点太过了，从未如此舒适过，很难想象这个满分女人能这么完美，温柔细腻乖萌还钓系，有什么是她不会的吗！微擦也不会生硬让人感到不适，绝对是我点过的虚恋No.1！",
                likes: 512
            },
            {
                name: "🍀",
                time: "2小时前",
                text: "如果星星是天空的留言，那我大概在晨岛写了第一行笨拙的‘你好’。一次次温柔的接住他人的情绪和梦境，也算是为很多无解的故事续写了结局。匆匆人海，我见过了你最好的模样，也是三生有幸。",
                likes: 999
            }
        ];

        function renderComments() {
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            
            initialComments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <img src="留言者头像.jpg" class="comment-avatar">
                    <div class="comment-content">
                        <div class="comment-header">
                            <span class="comment-user">${c.name}</span>
                            <span class="comment-time">${c.time}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                        <div class="comment-actions">
                            <div class="action-btn like-btn" onclick="toggleLike(this)">
                                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                <span>${c.likes}</span>
                            </div>
                            <div class="action-btn reply-btn" onclick="replyTo('${c.name}')">
                                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                <span>回复</span>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }
        renderComments();

        // 点赞逻辑
        function toggleLike(btn) {
            btn.classList.toggle('liked');
            const span = btn.querySelector('span');
            let count = parseInt(span.innerText);
            if (btn.classList.contains('liked')) {
                count++;
            } else {
                count--;
            }
            span.innerText = count;
        }

        // 回复逻辑
        function replyTo(name) {
            const input = document.getElementById('comment-input');
            input.value = `回复 @${name}：`;
            input.focus();
        }

        // ================= 5. 底部留言功能 =================
        function addComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text) return;

            const newComment = {
                name: "访客", 
                time: "刚刚",
                text: text,
                likes: 0
            };

            initialComments.unshift(newComment);
            renderComments();
            input.value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 绑定回车发送
        document.getElementById('comment-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addComment();
            }
        });
    </script>
</body>
</html>
